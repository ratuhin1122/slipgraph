worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  # The API issues a fresh CSPRNG nonce; HTML fails closed if bootstrap fails.
  sub_filter '__SLIPGRAPH_NONCE__' '$document_nonce';
  sub_filter_once off;
  etag off;
  add_header Cache-Control "no-store" always;
  limit_req_zone $binary_remote_addr zone=per_client:10m rate=20r/s;
  limit_req_status 429;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  upstream api_backend {
    zone api_backend 64k;
    server api:8080 resolve;
  }
  client_max_body_size 1m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  add_header Content-Security-Policy "default-src 'none'; script-src 'nonce-$document_nonce' 'strict-dynamic'; object-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; media-src blob:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    limit_req zone=per_client burst=200 nodelay;
    location = /_document_nonce {
      internal;
      proxy_pass http://api_backend/auth/document-nonce;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Real-IP $remote_addr;
    }
    location = /index.html {
      if_modified_since off;
      auth_request /_document_nonce;
      auth_request_set $document_nonce $upstream_http_x_csp_nonce;
    }
    location = /healthz { access_log off; return 200 'ok'; }
    location = /api/meetings {
      client_max_body_size 25m;
      client_body_timeout 120s;
      proxy_request_buffering off;
      proxy_send_timeout 120s;
      proxy_pass http://api_backend/meetings;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 3s;
      proxy_read_timeout 120s;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Permissions-Policy;
    }
    location /api/ {
      proxy_pass http://api_backend/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 3s;
      proxy_read_timeout 90s;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Permissions-Policy;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
