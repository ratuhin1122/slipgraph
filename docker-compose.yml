name: slipgraph
x-runtime: &runtime
  build: .
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - app_credentials:/run/app:ro
    - redis_credentials:/run/redis:ro
x-environment: &runtime-env
  APP_ENV: development
  DB_HOST: postgres
  DB_NAME: slipgraph
  DB_USER: slipgraph_app
  DB_PASSWORD_FILE: /run/app/app_password
  DB_SSLMODE: disable
  REDIS_HOST: redis
  REDIS_PASSWORD_FILE: /run/redis/redis_password
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AUTH_KEY_FILE: /run/app/auth_key
  TRUSTED_PROXY_HOST: web
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
services:
  credentials:
    image: alpine:3.23
    user: '0:0'
    entrypoint: [/bin/sh, /init-credentials.sh]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - postgres_credentials:/generated/postgres
      - owner_credentials:/generated/owner
      - app_credentials:/generated/app
      - redis_credentials:/generated/redis
      - ./deploy/init-credentials.sh:/init-credentials.sh:ro
    restart: 'no'
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: slipgraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/postgres/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: UTC
    depends_on:
      credentials: {condition: service_completed_successfully}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_credentials:/run/postgres:ro
      - owner_credentials:/run/owner:ro
      - app_credentials:/run/app:ro
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d slipgraph']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    entrypoint: [/bin/sh, /redis.sh]
    depends_on:
      credentials: {condition: service_completed_successfully}
    volumes:
      - redis_data:/data
      - redis_credentials:/run/redis:ro
      - ./deploy/redis.sh:/redis.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/redis/redis_password) redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  bootstrap:
    image: pgvector/pgvector:pg16
    entrypoint: [/bin/sh, /bootstrap-schemas.sh]
    volumes:
      - postgres_credentials:/run/postgres:ro
      - ./deploy/bootstrap-schemas.sh:/bootstrap-schemas.sh:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
  migrate:
    <<: *runtime
    command: [/app/migrate]
    restart: 'no'
    volumes:
      - owner_credentials:/run/owner:ro
      - redis_credentials:/run/redis:ro
    environment:
      <<: *runtime-env
      DB_USER: slipgraph_owner
      DB_PASSWORD_FILE: /run/owner/owner_password
    depends_on:
      bootstrap: {condition: service_completed_successfully}
  api:
    <<: *runtime
    command: [/app/api]
    environment:
      <<: *runtime-env
      HTTP_ADDR: ':8080'
    ports: ['127.0.0.1:${API_PORT:-8080}:8080']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s
  worker:
    <<: *runtime
    command: [/app/worker]
    environment:
      <<: *runtime-env
      HTTP_ADDR: ':8081'
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s
  web:
    build: {context: ., dockerfile: web/Dockerfile}
    ports: ['127.0.0.1:${WEB_PORT:-5173}:8080']
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  postgres_credentials:
  owner_credentials:
  app_credentials:
  redis_credentials:
