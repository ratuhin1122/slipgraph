      type: object
      additionalProperties: false
      required:
        - body
        - mention_ids
        - thread_id
        - client_id
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 8000
          description: Plain text, maximum 8000 UTF-8 bytes. slipgraph://task/<uuid> references are verified and stored as links.
        mention_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
        thread_id:
          type: string
          format: uuid
          nullable: true
        client_id:
          type: string
          format: uuid
          description: Stable UUID idempotency key; retain when retrying a send.
    EditMessageInput:
      type: object
      additionalProperties: false
      required:
        - body
        - mention_ids
        - version
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 8000
        mention_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
        version:
          type: integer
          format: int64
