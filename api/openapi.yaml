        - created_by_agent
        - requested_by_user
        - approved_by
        - expires_at
        - executed_at
        - source_object_ids
        - source_links
        - before
        - after
        - version
        - rejection_reason
        - failure_code
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - reschedule_task
            - add_dependency
            - create_task
            - change_assignee
            - create_plan
            - meeting_task
            - record_decision
        payload:
          type: object
          additionalProperties: true
        payload_hash:
          type: string
        approval_hash:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - expired
            - executed
            - failed
        created_by_agent:
          type: string
          format: uuid
        requested_by_user:
          type: string
          format: uuid
        approved_by:
          type: string
          format: uuid
          nullable: true
        expires_at:
          type: string
          format: date-time
        executed_at:
          type: string
          format: date-time
          nullable: true
        source_object_ids:
          type: array
          items:
            type: string
            format: uuid
        source_links:
          type: array
          items:
