components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-slipgraph_access
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Obtain a session-bound token from GET /auth/csrf. Required for every unsafe request, including signup/login.
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
    Role:
      type: string
      enum:
        - admin
        - member
        - viewer
    SignupInput:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - display_name
        - workspace_name
      properties:
        email:
          type: string
        password:
          type: string
        display_name:
          type: string
        workspace_name:
          type: string
    LoginInput:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    NameInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    TicketInput:
      type: object
      additionalProperties: false
      required:
        - ticket
      properties:
        ticket:
          type: string
          minLength: 43
          maxLength: 43
    TokenInput:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
    InviteInput:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
        role:
          type: string
          enum:
            - member
            - viewer
    RoleInput:
      type: object
      additionalProperties: false
      required:
        - role
        - version
      properties:
        role:
          $ref: '#/components/schemas/Role'
        version:
          type: integer
          format: int64
          minimum: 1
    CSRF:
      type: object
      additionalProperties: false
      required:
        - csrf_token
      properties:
        csrf_token:
          type: string
    InviteToken:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - display_name
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - user
        - workspace_id
        - workspace_name
        - role
        - expires_at
      properties:
        id:
          type: string
        user:
          $ref: '#/components/schemas/User'
        workspace_id:
          type: string
          readOnly: true
        workspace_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        expires_at:
          type: string
          format: date-time
    Workspace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - role
        - switch_token
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        switch_token:
          type: string
          description: Single-use ticket bound to the authenticated user, not a caller-chosen workspace ID.
    Member:
