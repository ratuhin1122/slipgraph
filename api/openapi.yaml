      type: object
      additionalProperties: false
      required:
        - user_id
        - name
        - typing
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        typing:
          type: boolean
    RealtimeClientFrame:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - subscribe
            - unsubscribe
            - typing
            - heartbeat
        channel_id:
          type: string
          format: uuid
        active:
          type: boolean
      description: >-
        Text frames <=4096 bytes. subscribe/unsubscribe require channel_id; typing also requires active. Heartbeat has
        no other fields. No workspace selector is accepted.
    RealtimeServerFrame:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - ready
            - subscribed
            - unsubscribed
            - event
            - presence
            - heartbeat
            - error
        channel_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        object_id:
          type: string
          format: uuid
        event_type:
          type: string
        version:
          type: integer
          format: int64
        code:
          type: string
      description: >-
        Notifications contain identifiers only. Re-fetch authorized REST data after subscribe, reconnect, and event.
        Deduplicate events by event_id.
