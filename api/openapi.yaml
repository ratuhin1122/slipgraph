      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        payload_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
    RejectProposalInput:
      type: object
      additionalProperties: false
      required:
        - version
        - payload_hash
        - reason
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        payload_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    DelayDetection:
      type: object
